</style></head><body><header><div class="brand"><span>▧</span>一张一张 <small class="smalltag"> / 绘图工作台</small></div><div class="topactions"><button class="plain" id="theme" type="button" aria-label="切换到浅色主题">浅色</button><button class="plain" id="export">导出备份</button><button class="plain" id="import">导入备份</button></div></header><main><section class="intro"><div><div class="eyebrow">SMALL STEPS, REAL PROGRESS</div><h1>把一套图，画成小成就。</h1><p class="subtitle">不用想着一次画完。今天，再点亮一张就好。</p></div><div class="progressbox"><div class="progresshead"><span>这套图的进度</span><strong id="percent">0<small>%</small></strong></div><div class="track"><div class="fill" id="fill"></div></div><div class="hint" id="progressText"></div></div></section><div class="workspace"><aside class="sidebar"><div class="sidebar-title">图纸分类</div><nav class="category-nav" id="categoryNav" aria-label="图纸分类"></nav></aside><div class="workspace-content"><div class="category-heading"><h2 id="categoryHeading">平面图纸</h2><span id="categorySummary"></span></div><div class="toolbar"><div class="filters" role="group" aria-label="筛选图纸"><button data-filter="all" class="active">全部</button><button data-filter="todo">待完成</button><button data-filter="done">已完成</button></div><div class="tools"><input id="search" placeholder="搜索图纸、备注、快捷键" aria-label="搜索"><button class="plain primary" id="add">＋ 添加图纸</button></div></div><section class="grid" id="grid" aria-label="图纸打卡"></section><div class="bottom"><span>点击卡片标记完成 · 再点一次可撤销 · 快捷键与备注直接显示 · 点击“添加一行”继续记录</span><span id="saveState">记录自动保存在当前浏览器</span></div></div></div></main><dialog id="editor"><form id="editform"><h2 id="dialogTitle">图纸笔记</h2><div class="dialoghint">把常用方法留在这里，下次画图少一点犹豫。</div><label for="title">图纸名称</label><input id="title" required maxlength="80"><label for="category">所属类别</label><select id="category"></select><label for="keys">常用命令 / 快捷键</label><textarea id="keys" placeholder="每行一个快捷键，例如：&#10;L 直线&#10;O 偏移&#10;TR 修剪" maxlength="10000"></textarea><label for="notes">绘图备注</label><textarea id="notes" placeholder="记录绘图顺序、检查事项、容易忘记的细节……" maxlength="10000"></textarea><div class="editrow" id="orderControls"><span class="hint">排列顺序</span><button type="button" class="plain" id="up">← 前移</button><button type="button" class="plain" id="down">后移 →</button><button type="button" class="plain danger" id="delete">删除</button></div><div class="dialogactions"><button type="button" class="plain" id="cancel">取消</button><button class="plain primary" type="submit">保存笔记</button></div></form></dialog><input type="file" id="file" accept="application/json,.json" hidden><div id="toast" role="status"></div><script>
let theme='dark';try{const savedTheme=localStorage.getItem('drawing-theme');if(savedTheme==='light')theme='light'}catch(e){}
function applyTheme(){document.documentElement.dataset.theme=theme;document.getElementById('theme').textContent=theme==='dark'?'浅色':'深色';document.getElementById('theme').setAttribute('aria-label',theme==='dark'?'切换到浅色主题':'切换到深色主题')}
applyTheme();document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();try{localStorage.setItem('drawing-theme',theme)}catch(e){}};

const initial=['目录','设计说明一','设计说明二','总览图','原始结构图','拆墙图','设计方案图','砌墙图','地面铺贴图','空间尺寸图','家具尺寸图','综合天花图','天花造型尺寸图','天花灯具尺寸图','灯具连线图','开关插座电位图','水路电位图','立面索引图','立面图 01','立面图 02','立面图 03','立面图 04','门头立面图'];
const categories=['封面说明','平面图纸','立面图纸','大样节点'];
function inferCategory(it){if(/大样|节点/.test(it.title))return '大样节点';if(/立面/.test(it.title)&&!/索引/.test(it.title))return '立面图纸';if(/封面|目录|说明|总览/.test(it.title))return '封面说明';return '平面图纸'}
function normalizeItems(list){return list.map(it=>({...it,category:categories.includes(it.category)?it.category:inferCategory(it)}))}
function categorySelect(value,label,onChange){const select=document.createElement('select');select.setAttribute('aria-label',label);categories.forEach(category=>{const option=document.createElement('option');option.value=category;option.textContent=category;select.append(option)});select.value=value;if(onChange)select.onchange=()=>onChange(select.value);return select}
const $=id=>document.getElementById(id),storageKey='drawing-checkin-v1';let items=initial.map((title,i)=>({id:'drawing-'+i,title,done:false,keys:'',notes:''})),filter='all',activeCategory='平面图纸',editing=null,timer;
function valid(a){return Array.isArray(a)&&a.length<=1000&&a.every(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&x.title.trim()&&typeof x.done==='boolean'&&typeof x.keys==='string'&&typeof x.notes==='string')&&new Set(a.map(x=>x.id)).size===a.length}
try{const s=localStorage.getItem(storageKey);if(s){const a=JSON.parse(s);if(valid(a))items=a;else toast('原记录格式异常，已显示初始清单')}}catch(e){toast('无法读取保存记录，请使用导出备份')}
items=normalizeItems(items);$('category').replaceChildren(...categorySelect(categories[0],'所属类别').children);
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),2500)}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(items));$('saveState').textContent='已自动保存 · 当前浏览器'}catch(e){$('saveState').textContent='保存失败，请导出备份';toast('浏览器存储不可用，请导出备份')}render()}
function appendNoteSection(parent,label,value,className){if(!value.trim())return;const section=document.createElement('section');section.className='note-section';const heading=document.createElement('div');heading.className='note-label';heading.textContent=label;const lines=document.createElement('ul');lines.className='note-lines '+className;value.split(/\r?\n/).forEach(line=>{const row=document.createElement('li');row.textContent=line||'\u00a0';lines.append(row)});section.append(heading,lines);parent.append(section)}
function render(){const nav=$('categoryNav');nav.replaceChildren();['全部图纸',...categories].forEach(category=>{const button=document.createElement('button');button.type='button';button.className=category===activeCategory?'active':'';button.setAttribute('aria-pressed',String(category===activeCategory));const name=document.createElement('span');name.textContent=category;const count=document.createElement('span');count.className='category-count';count.textContent=category==='全部图纸'?items.length:items.filter(it=>it.category===category).length;button.append(name,count);button.onclick=()=>{activeCategory=category;render()};nav.append(button)});const group=activeCategory==='全部图纸'?items:items.filter(it=>it.category===activeCategory);$('categoryHeading').textContent=activeCategory;$('categorySummary').textContent=`${group.length} 张图纸 · 已完成 ${group.filter(it=>it.done).length} 张`;const done=items.filter(x=>x.done).length,p=items.length?Math.round(done/items.length*100):0;$('percent').replaceChildren(document.createTextNode(p),Object.assign(document.createElement('small'),{textContent:'%'}));$('fill').style.width=p+'%';$('progressText').textContent=`已完成 ${done} / ${items.length} 张`;const grid=$('grid');grid.replaceChildren();const query=$('search').value.trim().toLowerCase();items.forEach((it,i)=>{if(activeCategory!=='全部图纸'&&it.category!==activeCategory)return;if(filter==='todo'&&it.done||filter==='done'&&!it.done||![it.title,it.keys,it.notes].join(' ').toLowerCase().includes(query))return;const card=document.createElement('article');card.className='card'+(it.done?' done':'');const b=document.createElement('button');b.className='toggle';b.setAttribute('aria-pressed',it.done);b.setAttribute('aria-label',it.title+(it.done?'，已完成，点击撤销':'，点击标记完成'));const num=document.createElement('span');num.className='number';num.textContent=String(i+1).padStart(2,'0');const check=document.createElement('span');check.className='check';check.textContent='✓';const h=document.createElement('h2');h.textContent=it.title;const status=document.createElement('span');status.className='status';status.textContent=it.done?'已完成':'待完成';b.append(num,check,h,status);b.onclick=()=>{it.done=!it.done;save();if(it.done)toast('✓ '+it.title+'，完成！')};const foot=document.createElement('div');foot.className='cardfoot';appendNoteSection(foot,'快捷键',it.keys,'shortcuts');appendNoteSection(foot,'绘图备注',it.notes,'');const actions=document.createElement('div');actions.className='card-actions';const addLine=document.createElement('button');addLine.type='button';addLine.className='note';addLine.textContent='＋ 添加一行';const edit=document.createElement('button');edit.type='button';edit.className='note';edit.textContent='编辑';edit.setAttribute('aria-label','编辑'+it.title+'的快捷键和备注');edit.onclick=()=>openEditor(it.id);actions.append(addLine,edit);const placement=categorySelect(it.category,it.title+'的所属类别',value=>{it.category=value;save();toast('已移至'+value)});placement.className='card-category';foot.append(actions,placement);addLine.onclick=()=>{if(foot.querySelector('.line-form')){foot.querySelector('.line-form input').focus();return}const form=document.createElement('form');form.className='line-form';const kind=document.createElement('select');kind.setAttribute('aria-label','记录类型');for(const [value,label] of [['keys','快捷键'],['notes','绘图备注']]){const option=document.createElement('option');option.value=value;option.textContent=label;kind.append(option)}const input=document.createElement('input');input.placeholder='输入一行，回车保存';input.setAttribute('aria-label','新增一行内容');input.required=true;input.maxLength=500;const submit=document.createElement('button');submit.type='submit';submit.className='plain';submit.textContent='添加';form.append(kind,input,submit);actions.before(form);input.focus();form.onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;const field=kind.value;it[field]=it[field]?it[field]+'\n'+value:value;save();toast('已添加一行')}};card.append(b,foot);grid.append(card)});if(!grid.children.length){const e=document.createElement('div');e.className='empty';e.textContent=query?'没有匹配的图纸，试试其他关键词。':filter==='done'?'还没有点亮的图纸，从一张开始吧。':filter==='todo'?'全部完成了，给自己一点掌声。':'这个类别还没有图纸，可添加图纸，或在其他卡片底部更改所属类别。';grid.append(e)}}
function openEditor(id){editing=id;const it=items.find(x=>x.id===id);$('title').value=it?.title||'';$('keys').value=it?.keys||'';$('notes').value=it?.notes||'';$('category').value=it?.category||(activeCategory==='全部图纸'?'平面图纸':activeCategory);$('dialogTitle').textContent=it?'图纸笔记':'添加一张图纸';$('orderControls').hidden=!it;const i=items.indexOf(it);$('up').disabled=i<=0;$('down').disabled=i===items.length-1;$('editor').showModal()}
$('editform').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;let it=items.find(x=>x.id===editing);if(!it){it={id:crypto.randomUUID?crypto.randomUUID():'drawing-'+Date.now(),done:false};items.push(it)}Object.assign(it,{title,category:$('category').value,keys:$('keys').value.trim(),notes:$('notes').value.trim()});save();$('editor').close();toast('笔记已保存')};$('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor(null);function move(d){const i=items.findIndex(x=>x.id===editing),j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];save();$('up').disabled=j===0;$('down').disabled=j===items.length-1;toast('顺序已更新')}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('delete').onclick=()=>{if(confirm('删除这张图纸及其笔记？此操作不可撤销。')){items=items.filter(x=>x.id!==editing);save();$('editor').close()}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='施工图打卡备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份已导出')};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(data.version!==1||!valid(data.items))throw Error();if(confirm('导入将替换当前清单和进度，建议先导出备份。继续？')){items=normalizeItems(data.items);save();toast('备份已恢复')}}catch(err){toast('备份格式不正确，未更改当前记录')}e.target.value=''};render();
</script></body></html>
